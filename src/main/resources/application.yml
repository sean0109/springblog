spring:
  application:
    name: springblog

  # Oracle Database
  datasource:
    url: jdbc:p6spy:oracle:thin:@localhost:1521/FREEPDB1
    username: springblog
    password: oracle
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: springblog.model
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: null

# Logging (SQL)
logging:
  level:
    springblog.mapper: DEBUG
    p6spy: INFO

# Server port (temporary)
server:
  port: 8080
