#################################################################
# P6Spy Options File                                            #
# See documentation for detailed instructions                   #
# https://p6spy.readthedocs.io/en/latest/configandusage.html   #
#################################################################

#################################################################
# MODULES                                                       #
#                                                               #
# Module list addapted from the documentation.                 #
# com.p6spy.engine.spy.P6SpyFactory must be the first item.   #
#################################################################

modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory

################################################################
# CORE (P6SPY) PROPERTIES                                      #
################################################################

# Real driver to use
realdriver=oracle.jdbc.OracleDriver
# Real datasource to use
#realdatasource=

# Class file where application server initialization properties are loaded from.
#realdatasourceclass=

# Request is logged only if it's execution time exceeds the specified limit (in ms). Default is 0 (log everything)
#executionThreshold=

################################################################
# DataSource replacement                                       #
################################################################

# When true (default), the data source is replaced with a P6Spy proxy instance.
# Use autoflush=true to log in real-time, otherwise log statements are buffered until the end of the logging cycle.
autoflush=true

# Log file to use. Leave blank to use stderr, or set to stdout to use stdout.
# If no logging option is configured, stdout is used by default.
#logfile=spy.log
logfile=

# Append to the specified log file.  When this is set to false, the log file is truncated at each subsequent instantiation of P6Spy (if not using stdout or stderr).  Default is true.
append=true

# Log format, class to use
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat

# Custom format for log messages
customLogMessageFormat=%(currentTime) | %(executionTime) ms | %(category) | connection: %(connectionId) | %(sqlSingleLine)

# Log entry separator to use, default is a new line.
#logLineEntryFormat=\n

# Date format
dateformat=yyyy-MM-dd HH:mm:ss

# Regex to filter which SQL statements to log
# Defaults to an empty string which matches anything.
#filter=

# Regex to exclude which SQL statements should not be logged
# Defaults to an empty string which excludes nothing.
#exclude=

# Log whether a statement is a Batch Statement
databaseDialectBooleanFormat=boolean

# Log DDL statements (CREATE, ALTER, DROP, etc.)
excludecategories=info,debug,result,resultset,batch

# Use actual params instead of ? placeholders in the logged SQL.
# This works by calling the JDBC driver's toString() method for each parameter object.
#
# Set to true to see actual parameter values.
# Default is false to avoid potential performance impact or security concerns
# (e.g., passwords being logged in plain text).
#
# Note: If you're using a modern p6spy version, this is implicit when using
# sqlSingleLine display mode. If you're not seeing actual values, ensure you
# didn't set this to false.
#driverlist=
