<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>velog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 상단 네비게이션 -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <a th:href="@{/}">DuDuBlog</a>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" title="알림">
                    <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                    </svg>
                </button>
                <button class="icon-btn" title="검색">
                    <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </button>
                <a th:href="@{/login}" class="btn-login">로그인</a>
            </div>
        </div>
    </nav>

    <!-- 메인 컨테이너 -->
    <div class="yt-main">
        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 스티키 헤더 (스크롤 시 고정) -->
            <div class="content-header">
                <nav class="content-nav">
                    <button class="nav-tab active" data-tab="trending">
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                        </svg>
                        트렌딩
                    </button>
                    <button class="nav-tab" data-tab="recent">
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        추천
                    </button>
                    <button class="nav-tab" data-tab="latest">
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        최신
                    </button>
                    <button class="nav-tab" data-tab="feed">
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 5c7.18 0 13 5.82 13 13M6 11a7 7 0 017 7m-6 0a1 1 0 11-2 0 1 1 0 012 0z"/>
                        </svg>
                        피드
                    </button>
                </nav>
                <div class="filter-options">
                    <select class="period-select">
                        <option value="week">이번 주</option>
                        <option value="month">이번 달</option>
                        <option value="year">올해</option>
                    </select>
                    <button class="more-btn">
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M12 6v.01M12 12v.01M12 18v.01"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 게시글 그리드 -->
            <div class="yt-article-area posts-grid">
                <article th:each="post : ${posts}" class="yt-card-item">
                    <a th:href="@{/posts/{id}(id=${post.id})}" class="post-link">
                        <div class="yt-card-thumb post-thumbnail">
                            <img th:src="${post.thumbnail != null ? post.thumbnail : 'https://via.placeholder.com/400x210'}"
                                 th:alt="${post.title}">
                        </div>
                        <div class="post-content">
                            <h2 class="yt-card-title post-title" th:text="${post.title}"></h2>
                            <p class="post-excerpt" th:text="${post.excerpt}"></p>
                            <div class="post-date-text"
                                 th:text="${#temporals.format(post.date, 'yyyy년 M월 d일')} + ' · 0개의 댓글'"></div>
                        </div>
                    </a>
                    <div class="post-footer">
                        <div class="author-info">
                            <img th:src="${post.author != null ? 'https://ui-avatars.com/api/?name=' + post.author + '&background=12b886&color=fff' : 'https://ui-avatars.com/api/?name=User&background=12b886&color=fff'}"
                                 th:alt="${post.author}"
                                 class="author-avatar">
                            <span class="author-name" th:text="'by ' + ${post.author != null ? post.author : 'Anonymous'}"></span>
                        </div>
                        <div class="post-likes">
                            <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                            <span th:text="${post.likes != null ? post.likes : 0}"></span>
                        </div>
                    </div>
                </article>
            </div>
        </main>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
