<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - SpringBlog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 상단 네비게이션 (검색창 없음) -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <a th:href="@{/}">SpringBlog</a>
            </div>
            <div class="nav-actions">
                <a th:href="@{/login}" class="btn-login">로그인</a>
            </div>
        </div>
    </nav>

    <!-- 회원가입 폼 컨테이너 -->
    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-header">
                <h1>회원가입</h1>
                <p>SpringBlog에 오신 것을 환영합니다</p>
            </div>

            <form th:action="@{/new/member}" th:object="${memberForm}" method="post" class="signup-form">
                <div class="form-group">
                    <label for="loginId">아이디</label>
                    <input type="text"
                           id="loginId"
                           th:field="*{loginId}"
                           placeholder="ID를 입력해 주세요"
                           th:class="${#fields.hasErrors('loginId')}? 'form-input error' : 'form-input'"
                           th:readonly="${memberForm.loginId != null}">
                    <span class="error-message" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></span>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="example@email.com"
                           class="form-input">
                    <span class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="비밀번호를 입력하세요"
                           class="form-input">
                    <span class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>

                <button type="submit" class="btn-submit">회원가입</button>

                <div class="form-footer">
                    <span>이미 계정이 있으신가요?</span>
                    <a th:href="@{/login}" class="link-login">로그인</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/main.js}">


    </script>
</body>
</html>
