<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 가입</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body>
<form th:action="@{/new/member}" th:object="${memberForm}" method="post">
    <input type="text" th:field="*{loginId}" placeholder="ID 입력 후 중복 검사를 해주세요."
           th:class="${#fields.hasErrors('loginId')}? 'form-control fieldError' : 'form-control'"
           th:readonly="${memberForm.loginId != null}" style="display: block;">
    <input type="text" th:field="*{email}" class="form-control" style="display: block;">
    <input type="password" th:field="*{password}" class="form-control" style="display: block;">

    <button type="submit" >회원 가입</button>
</form>
<script>

    document.addEventListener("DOMContentLoaded", () => {

    });





</script>
</body>
</html>
